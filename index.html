<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Stok Kaos - Firebase CRUD</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Style kustom -->
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="index">

  <nav class="navbar navbar-dark navbar-custom">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-bag-check-fill me-2"></i>WASTING MONEY
      </span>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-light text-dark" id="connStatus">
          <span class="spinner-grow spinner-grow-sm text-secondary" role="status"></span> menghubungkan...
        </span>
        <!-- Menu User (tampil setelah login terdeteksi) -->
        <div id="userMenu" class="d-none align-items-center gap-3">
          <span class="text-white small" id="userEmailDisplay"></span>
          <button class="btn btn-sm btn-outline-light" id="logoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i>Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-4">

    <!-- APLIKASI UTAMA CRUD (disembunyikan sampai status login dipastikan) -->
    <div id="mainAppSection" class="row g-4 d-none">
      <!-- FORM CREATE / UPDATE -->
      <div class="col-lg-4">
        <div class="card shadow-sm sticky-top" style="top: 1rem;">
          <div class="card-header bg-dark text-white">
            <i class="bi bi-pencil-square me-1"></i>
            <span id="formTitle">Tambah Kaos Baru</span>
          </div>
          <div class="card-body">
            <form id="kaosForm">
              <input type="hidden" id="kaosId">

              <div class="mb-3">
                <label for="namaKaos" class="form-label">Nama Kaos</label>
                <input type="text" class="form-control" id="namaKaos" placeholder="Misal: Slipknot Tour Tee" required>
              </div>

              <div class="mb-3">
                <label for="ukuran" class="form-label">Ukuran</label>
                <select class="form-select" id="ukuran" required>
                  <option value="" disabled selected>Pilih ukuran</option>
                  <option value="S">S</option>
                  <option value="M">M</option>
                  <option value="L">L</option>
                  <option value="XL">XL</option>
                  <option value="XXL">XXL</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="warna" class="form-label">Warna</label>
                <input type="text" class="form-control" id="warna" placeholder="Misal: Hitam" required>
              </div>

              <div class="mb-3">
                <label for="harga" class="form-label">Harga (Rp)</label>
                <input type="number" class="form-control" id="harga" min="0" step="1000" placeholder="Misal: 150000" required>
              </div>

              <div class="mb-3">
                <label for="stok" class="form-label">Stok (pcs)</label>
                <input type="number" class="form-control" id="stok" min="0" step="1" placeholder="Misal: 20" required>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark flex-fill" id="submitBtn">
                  <i class="bi bi-plus-circle me-1"></i>Simpan
                </button>
                <button type="button" class="btn btn-outline-secondary" id="cancelEditBtn" style="display:none;">
                  Batal
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- TABLE READ / DELETE -->
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <span><i class="bi bi-table me-1"></i>Daftar Stok Kaos</span>
            <span class="badge bg-secondary" id="totalCount">0 item</span>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Nama Kaos</th>
                    <th>Ukuran</th>
                    <th>Warna</th>
                    <th>Harga</th>
                    <th>Stok</th>
                    <th class="text-end">Aksi</th>
                  </tr>
                </thead>
                <tbody id="kaosTableBody">
                  <tr>
                    <td colspan="6" class="text-center text-muted py-4">Memuat data...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast notifikasi -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="mainToast" class="toast align-items-center text-white border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">Berhasil!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
